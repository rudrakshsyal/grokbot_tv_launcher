<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Glass Home">
<meta name="theme-color" content="#07080d"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" href="/icon-192.png">
<title>Glass Home</title>
<style>
:root{--fg:#eef0f7;--dim:#8d93ab;--faint:#5d637c;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.11);--line:rgba(255,255,255,.09);--acc:#7c8cff;--ok:#5fe0a1;--warn:#ffc561;--bad:#ff8080}
[hidden]{display:none!important}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#07080d;color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 12px);-webkit-user-select:none;user-select:none}
body:before{content:'';position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 30% at 20% 18%,rgba(92,104,255,.28),transparent 70%),radial-gradient(35% 28% at 85% 60%,rgba(170,80,255,.16),transparent 70%),radial-gradient(45% 30% at 40% 100%,rgba(40,150,255,.14),transparent 70%)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.25)}
.press{transition:transform .14s cubic-bezier(.3,.7,.4,1),background .14s}
.press.down,.press:active{transform:scale(.93);background:var(--glass2)}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;height:40px}
.pill{display:flex;align-items:center;gap:8px;height:32px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:500;color:#cfd3e4;white-space:nowrap;overflow:hidden;max-width:72%}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.04)}
.pill.ok i{background:var(--ok);box-shadow:0 0 10px rgba(95,224,161,.6)}.pill.warn i{background:var(--warn)}.pill.bad i{background:var(--bad)}
.pwr{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.pwr svg{width:19px;height:19px;stroke:#ff8f8f}
.seg{position:relative;display:flex;margin:12px 0 4px;border-radius:14px;padding:3px;height:40px}
.seg button{flex:1;position:relative;z-index:1;font-size:14px;font-weight:600;color:var(--dim);border-radius:11px;transition:color .2s}
.seg button.on{color:#fff}
.seg b{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:11px;background:rgba(255,255,255,.13);box-shadow:0 2px 10px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .32s cubic-bezier(.3,.8,.3,1)}
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .22s,transform .22s}
.view.on{opacity:1;pointer-events:auto;transform:none}
/* remote */
#vRemote{justify-content:space-evenly;padding-top:6px}
.mode{display:flex;gap:4px;font-size:12px;font-weight:600;letter-spacing:.02em}
.mode button{padding:5px 11px;border-radius:99px;color:var(--faint)}.mode button.on{color:var(--fg);background:var(--glass)}
.dpad{position:relative;width:min(272px,70vw);height:min(272px,70vw);border-radius:50%;flex:none;touch-action:none}
.dpad .arr{position:absolute;display:grid;place-items:center;width:34%;height:34%;border-radius:50%}
.dpad .arr svg{width:22px;height:22px;stroke:#dfe3f2;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.dpad .u{top:0;left:33%}.dpad .d{bottom:0;left:33%}.dpad .l{left:0;top:33%}.dpad .r{right:0;top:33%}
.dpad .arr.down{transform:scale(.9);background:rgba(255,255,255,.08)}
.dpad .ok{position:absolute;left:31%;top:31%;width:38%;height:38%;border-radius:50%;font-size:15px;font-weight:600;letter-spacing:.06em;color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.35)}
.pad{position:relative;width:min(300px,78vw);height:min(272px,70vw);border-radius:30px;display:grid;place-items:center;color:var(--faint);font-size:13px;touch-action:none;flex:none}
.pad .dot{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,rgba(160,175,255,.45),transparent 70%);pointer-events:none;opacity:0;transition:opacity .2s}
.row{display:flex;gap:18px;justify-content:center;align-items:center}
.cb{width:62px;height:62px;border-radius:50%;display:grid;place-items:center}
.cb svg,.vol svg{width:22px;height:22px;fill:none;stroke:#e6e9f5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vol{display:flex;align-items:center;height:56px;border-radius:99px;padding:0 4px}
.vol button{width:64px;height:48px;border-radius:99px;display:grid;place-items:center}
.vol span{width:1px;height:22px;background:var(--line)}
.apps{width:100%;display:flex;gap:9px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.apps::-webkit-scrollbar{display:none}
.app{flex:none;display:flex;align-items:center;gap:8px;height:42px;padding:0 15px 0 12px;border-radius:99px;font-size:14px;font-weight:500;color:#dfe2ef}
.app i{width:9px;height:9px;border-radius:50%;flex:none}
.cap{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600;align-self:flex-start;margin:0 0 2px 4px}
/* yo-yo: chat */
#vYoyo{justify-content:flex-start;align-items:stretch;padding-top:6px}
.chead{display:flex;align-items:center;gap:10px;flex:none;height:44px}
.ib{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ib svg{width:19px;height:19px;fill:none;stroke:#e6e9f5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctitle{flex:1;min-width:0;text-align:center}
#ctitle{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ystate{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--dim);height:14px;margin-top:1px}
.thread{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:9px;padding:12px 2px 10px;mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 10px),transparent);scrollbar-width:none}
.thread::-webkit-scrollbar{display:none}
.empty{margin:auto 10px;text-align:center;color:var(--dim);font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--fg);font-size:19px;font-weight:650;margin-bottom:6px;letter-spacing:-.01em}
.msg{position:relative;max-width:84%;padding:10px 14px;border-radius:21px;font-size:16px;line-height:1.38;white-space:pre-wrap;word-wrap:break-word;-webkit-user-select:text;user-select:text;animation:pop .28s cubic-bezier(.3,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
.msg.me{align-self:flex-end;border-bottom-right-radius:7px;color:#fff;background:linear-gradient(140deg,rgba(132,146,255,.62),rgba(118,84,255,.46));border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -8px 18px rgba(40,20,120,.18),0 8px 22px rgba(70,60,200,.25)}
.msg.bot{align-self:flex-start;border-bottom-left-radius:7px;color:#e9ebf5;background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 26px rgba(0,0,0,.25)}
.msg.err{border-color:rgba(255,128,128,.35)}
.msg small{display:block;margin-top:6px;color:var(--faint);font-size:11.5px;white-space:normal}
.msg .pl{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:rgba(95,224,161,.14);color:#a6f1cb;white-space:normal}
.msg .pl.open{background:rgba(124,140,255,.16);color:#c6cdff}.msg .pl.no{background:rgba(255,197,97,.14);color:#ffd99a}
.msg .its{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.msg .its span{font-size:12px;padding:3px 8px;border-radius:9px;background:rgba(255,255,255,.08);color:#d5d9ea}
.msg .rp{float:right;margin:-3px -6px 4px 8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.msg .rp svg{width:16px;height:16px;fill:none;stroke:#dfe3f2;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msg .rp.on{background:var(--acc)}
.msg .tvb{display:flex;align-items:center;gap:6px;margin-top:9px;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;color:#d7dcff;background:rgba(124,140,255,.16);border:1px solid rgba(255,255,255,.12);white-space:normal;text-align:left;line-height:1.3}
.msg .tvb svg{flex:none;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msg .tvb.arm{color:#ffe2a8;background:rgba(255,197,97,.16);border-color:rgba(255,197,97,.3)}
.msg .tvb.busy{opacity:.55}
.dots{display:inline-flex;gap:5px;padding:4px 2px}.dots i{width:7px;height:7px;border-radius:50%;background:#c9cfef;opacity:.35;animation:dot 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{opacity:1;transform:translateY(-3px)}}
.dock{flex:none;padding-top:6px}
#heard{min-height:20px;max-height:44px;overflow:hidden;margin:0 4px 8px;font-size:15px;font-weight:500;line-height:1.35;text-align:center;color:#f3f4fa;-webkit-user-select:text;user-select:text}
#heard.interim{color:var(--dim)}
.comp{display:flex;align-items:center;gap:10px}
form{flex:1;min-width:0;display:flex;align-items:center;height:52px;border-radius:26px;padding:0 5px 0 4px}
input[type=text]{flex:1;min-width:0;height:44px;padding:0 12px;border:0;background:none;font:16px -apple-system,sans-serif;color:#fff;outline:none;-webkit-user-select:text;user-select:text}
input::placeholder{color:var(--faint)}
.go{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--acc)!important;opacity:.35;transition:opacity .2s,transform .14s}
form.has .go{opacity:1}
.go svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.micwrap{position:relative;flex:none;width:68px;height:68px;display:grid;place-items:center}
#mic{position:relative;width:64px;height:64px;border-radius:50%;touch-action:none;-webkit-user-select:none;user-select:none;
 background:radial-gradient(circle at 34% 28%,#c3cdff,#7180ff 42%,#4434c6 100%);box-shadow:0 0 28px rgba(103,116,255,.45),inset 0 -6px 16px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .2s cubic-bezier(.3,.8,.3,1),filter .2s}
#mic svg{width:27px;height:27px;fill:#fff;opacity:.95;pointer-events:none}
.micwrap:before{content:'';position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(255,140,180,.45);transform:scale(.8);opacity:0;transition:.3s;pointer-events:none}
.listening #mic{transform:scale(1.14);background:radial-gradient(circle at 34% 28%,#ffd0e2,#ff6f9a 42%,#b8265e 100%);box-shadow:0 0 44px rgba(255,100,150,.6),inset 0 -6px 16px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.35)}
.listening .micwrap:before{opacity:1;animation:ring 1.4s ease-out infinite}
.cancelling #mic{transform:scale(.96);filter:grayscale(.85) brightness(.75)}
.sending #mic{animation:breathe 1.2s ease-in-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes breathe{50%{transform:scale(.94);filter:brightness(1.15)}}
.yopts{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.lang{display:flex;padding:3px;border-radius:16px;gap:2px}
.lang button{height:28px;padding:0 10px;border-radius:13px;font:600 12.5px -apple-system,sans-serif;color:var(--dim);transition:background .2s,color .2s}
.lang button.on{background:rgba(255,255,255,.16);color:#fff}
.sw{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);font-weight:600}.sw input{accent-color:var(--acc);width:17px;height:17px;margin:0}
.yfoot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:11.5px;color:var(--faint)}
#micl{font-weight:600;color:var(--dim);white-space:nowrap}
#brain{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* chats drawer */
.drawer{position:fixed;inset:0;z-index:8;background:rgba(4,5,10,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dsheet{position:absolute;left:10px;top:calc(env(safe-area-inset-top) + 10px);bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(330px,86vw);border-radius:28px;display:flex;flex-direction:column;padding:14px 10px 10px;background:rgba(22,24,38,.72)!important;animation:slide .28s cubic-bezier(.3,.8,.3,1)}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
.dh{display:flex;align-items:center;gap:8px;padding:0 6px 10px}
.dh b{flex:1;font-size:20px;font-weight:700;letter-spacing:-.02em}
.dh button{height:32px;padding:0 13px;border-radius:16px;font:600 13.5px -apple-system,sans-serif;background:rgba(255,255,255,.1)}
.dh button.pri{background:var(--acc)}
#clist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:4px}
.crow{display:flex;align-items:center;gap:4px;border-radius:16px;padding:9px 6px 9px 12px;transition:background .15s}
.crow.cur{background:rgba(124,140,255,.16)}
.crow .cm{flex:1;min-width:0;text-align:left}
.crow .ct{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cp{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.crow input{width:100%;height:32px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);font:600 15px -apple-system,sans-serif}
.crow .ca{flex:none;height:32px;min-width:32px;border-radius:16px;display:grid;place-items:center;padding:0 7px;color:var(--dim);font:600 12.5px -apple-system,sans-serif}
.crow .ca svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crow .ca.arm{background:rgba(255,96,96,.22);color:#ffb0b0}
.cnone{color:var(--faint);text-align:center;font-size:14px;margin-top:30px}
/* home */
#vHome{justify-content:center}
.soon{width:100%;max-width:340px;border-radius:26px;padding:30px 24px;text-align:center}
.soon svg{width:40px;height:40px;stroke:var(--acc);fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.soon h2{margin:14px 0 6px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.soon p{margin:0;color:var(--dim);font-size:14px}
/* pairing banner */
.pairb{flex:none;margin:0 16px 10px;border-radius:22px;padding:15px 16px 14px;display:flex;gap:13px;align-items:flex-start;border-color:rgba(255,196,87,.35)!important;background:linear-gradient(135deg,rgba(255,190,80,.16),rgba(255,255,255,.05))!important}
.pairb.bad{border-color:rgba(255,107,107,.38)!important;background:linear-gradient(135deg,rgba(255,96,96,.16),rgba(255,255,255,.05))!important}
.pairb .pi{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,196,87,.18)}
.pairb.bad .pi{background:rgba(255,107,107,.18)}
.pairb .pi svg{width:22px;height:22px;fill:none;stroke:#ffd38a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pairb.bad .pi svg{stroke:#ff9f9f}
.pairb.spin .pi svg{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.9)}}
.pairb h3{margin:1px 0 4px;font-size:16px;font-weight:650;letter-spacing:-.01em;color:#fff}
.pairb p{margin:0;font-size:13px;line-height:1.38;color:#d6d9e6}
.pairb b{color:#fff;font-weight:600}
.pairb .pa{display:flex;gap:8px;align-items:center;margin-top:11px}
.pairb button{flex:none;white-space:nowrap;height:34px;padding:0 15px;border-radius:17px;font:600 14px -apple-system,sans-serif;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18)}
.pairb button.pri{background:var(--acc);border-color:transparent}
.pairb .pt{font-size:12px;color:var(--faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;max-width:86%;padding:11px 16px;border-radius:16px;font-size:14px;text-align:center;color:#eef0f7;pointer-events:none;transition:.25s;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<div class="top"><div class="pill glass" id="pill"><i></i><span id="pillt">Connecting…</span></div>
  <button class="pwr glass press" id="pwr" aria-label="Power"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg></button></div>
<nav class="seg glass" id="seg"><b id="segb"></b><button data-v="remote">Remote</button><button data-v="yoyo">Yo-Yo</button><button data-v="home">Home</button></nav>
<div class="pairb glass" id="pairb" hidden role="status" aria-live="polite"><div class="pi"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8 20h8M12 16.5V20"/></svg></div>
 <div style="flex:1;min-width:0"><h3 id="pairh"></h3><p id="pairp"></p><div class="pa"><button class="press pri" id="pairgo">Retry pair</button><span class="pt" id="pairt"></span></div></div></div>
<main class="views">
 <section class="view" id="vRemote">
  <div class="mode" id="mode"><button data-m="dpad">Buttons</button><button data-m="pad">Touchpad</button></div>
  <div class="dpad glass" id="dpad">
   <button class="arr u" data-k="KEY_UP" aria-label="Up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
   <button class="arr d" data-k="KEY_DOWN" aria-label="Down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
   <button class="arr l" data-k="KEY_LEFT" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
   <button class="arr r" data-k="KEY_RIGHT" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
   <button class="ok press" data-k="KEY_ENTER">OK</button>
  </div>
  <div class="pad glass" id="pad" hidden><span>Swipe to move · tap to select</span><div class="dot" id="pdot"></div></div>
  <div class="row">
   <button class="cb glass press" data-k="KEY_RETURN" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
   <button class="cb glass press" data-k="KEY_HOME" aria-label="TV Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg></button>
   <button class="cb glass press" data-k="PLAYPAUSE" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="M5 5l8 7-8 7z"/><path d="M16 5v14M20 5v14"/></svg></button>
  </div>

let lang = LANGS[localStorage.getItem('rv.lang')] ? localStorage.getItem('rv.lang') : 'en-US';

// v6.2 "Show on TV": long answers get a button that opens the whole answer in a big panel on the TV (POST /tv/show).

// fills an assistant bubble from an /ask answer or a stored message ({ text, brain, stats, items, played, spoken })
function fillBot(b, r, live, index) {

const ago = t => { const s = (Date.now() - t) / 1000; return s < 60 ? 'now' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : s < 604800 ? Math.floor(s / 86400) + 'd' : new Date(t).toLocaleDateString(); };
const PEN = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>', BIN = '<svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg>';
